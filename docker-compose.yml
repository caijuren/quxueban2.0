# 趣学伴生产环境 Docker Compose 编排
# 用法：
#   1. 复制 .env.example 为 .env.production 并修改密钥
#   2. docker compose up -d db
#   3. docker compose run --rm seed        # 首次初始化数据
#   4. docker compose up -d app
#   5. 通过 Nginx 反向代理访问（应用只监听 127.0.0.1:3000）

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quxueban
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: quxueban
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quxueban -d quxueban"]
      interval: 5s
      timeout: 5s
      retries: 5
    # 数据库不暴露到公网，只在 Docker 内部网络访问
    expose:
      - "5432"

  app:
    build: .
    ports:
      # 只绑定本地，由 Nginx 统一反向代理，避免直接暴露在公网
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://quxueban:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/quxueban?schema=public
      NODE_ENV: production
    volumes:
      # 上传文件持久化卷：避免容器重建后照片/语音丢失
      - app_uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    # Dockerfile 的 CMD 已包含迁移与启动命令

  seed:
    build:
      context: .
      target: builder
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://quxueban:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/quxueban?schema=public
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts"
    restart: "no"

volumes:
  postgres_data:
  app_uploads:
